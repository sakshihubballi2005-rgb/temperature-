<!DOCTYPE html>
<html>
<head>
    <title>College Events</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="#">College Events</a>
    </div>
</nav>

<div class="container mt-4">
    <h3 class="text-center">Welcome to College Events</h3>
    <!-- Alert -->
    <div class="alert alert-success alert-dismissible fade show">
        Registration is open for Annual Day!
        <button type="button" class="btn-close"
            data-bs-dismiss="alert"></button>
    </div>

    <!-- Event Details -->
    <div class="card p-3">
        <h5 class="card-title">Annual Day Celebration</h5>
        <p class="card-text">
            Join us for cultural programs, music and dance.
        </p>
        <button class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#eventModal">
            Register Now
        </button>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="eventModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Event Registration</h5>
                <button type="button" class="btn-close"
                    data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                You have successfully registered for the Annual Day!
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-success"
                    data-bs-dismiss="modal">
                    OK
                </button>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
